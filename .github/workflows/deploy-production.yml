name: Deploy LMN24 to OVH (manual)

# Deploying to production is NEVER triggered by push or pull request.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lmn24-production-deployment
  cancel-in-progress: false

jobs:
  validate:
    name: Validate approved main version
    # Never deploy a branch other than main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lmn24

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.10.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify deployment script syntax
        run: bash -n scripts/deploy-production.sh

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  deploy:
    name: Deploy exact verified commit
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Deploy using pinned SSH host key
        shell: bash
        env:
          LMN24_DEPLOY_SSH_KEY: ${{ secrets.LMN24_DEPLOY_SSH_KEY }}
          LMN24_DEPLOY_KNOWN_HOSTS: ${{ secrets.LMN24_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "$LMN24_DEPLOY_SSH_KEY" ] || [ -z "$LMN24_DEPLOY_KNOWN_HOSTS" ]; then
            echo "Configure LMN24_DEPLOY_SSH_KEY and LMN24_DEPLOY_KNOWN_HOSTS in GitHub Actions secrets." >&2
            exit 1
          fi

          SSH_DIR="$RUNNER_TEMP/lmn24-deploy-ssh"
          install -d -m 700 "$SSH_DIR"
          printf '%s\n' "$LMN24_DEPLOY_SSH_KEY" > "$SSH_DIR/id_ed25519"
          printf '%s\n' "$LMN24_DEPLOY_KNOWN_HOSTS" > "$SSH_DIR/known_hosts"
          chmod 600 "$SSH_DIR/id_ed25519" "$SSH_DIR/known_hosts"

          ssh -i "$SSH_DIR/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o ConnectTimeout=15 \
            ubuntu@57.128.190.216 \
            "bash -s -- $DEPLOY_SHA" < scripts/deploy-production.sh
