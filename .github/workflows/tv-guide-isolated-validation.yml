name: TV Guide isolated architecture validation

on:
  push:
    branches: [main]
    paths:
      - "docs/BMAD/guide-tv-mondial-winston-schema-prototype.sql"
      - "docs/BMAD/guide-tv-mondial-winston-prisma-proposition.prisma"
      - "docs/BMAD/guide-tv-mondial-winston-postgres-isolated-smoke.sql"
      - ".github/workflows/tv-guide-isolated-validation.yml"
      - "scripts/tv-guide-concurrency-isolated.cjs"
      - "scripts/tv-guide-security-isolated.cjs"
      - "database/schema.sql"
      - "docs/BMAD/guide-tv-mondial-winston-migration-candidate.sql"
      - "docs/BMAD/guide-tv-mondial-winston-audit-privileges.sql"
      - "docs/BMAD/guide-tv-mondial-winston-catalog-inventory.sql"
      - "docs/BMAD/guide-tv-mondial-scrum115-catalog-isolated-smoke.sql"
      - "docs/BMAD/guide-tv-mondial-scrum116-epg-sources-isolated-smoke.sql"
      - "docs/BMAD/guide-tv-mondial-scrum117-import-atomic-isolated-smoke.sql"
      - "docs/BMAD/guide-tv-mondial-scrum117-retention-recovery-isolated-smoke.sql"
      - "docs/BMAD/guide-tv-mondial-scrum118-public-read-isolated-smoke.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tv-schema:
    name: Isolated Prisma and PostgreSQL tests (no production access)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tv_guide_isolated
        options: >-
          --health-cmd "pg_isready -U postgres -d tv_guide_isolated"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tv_guide_isolated
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.10.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build isolated full Prisma schema (never edit canonical schema)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("packages/database")
          original = (root / "schema.prisma").read_text()
          addition = Path("docs/BMAD/guide-tv-mondial-winston-prisma-proposition.prisma").read_text()
          marker = '  sources Source[]'
          assert original.count(marker) == 1, "Country inverse insertion marker changed"
          original = original.replace(marker, '  tvCountry TvCountry?\n' + marker, 1)
          (root / ".tv-guide-isolated.prisma").write_text(original + "\n\n" + addition)
          PY
      - name: Prisma validate isolated complete schema
        run: pnpm --filter @lmn24/database exec prisma validate --schema .tv-guide-isolated.prisma
      - name: Prisma generate in isolated workspace
        run: pnpm --filter @lmn24/database exec prisma generate --schema .tv-guide-isolated.prisma
      - name: Create disposable baseline country table and fencing function
        run: |
          docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d tv_guide_isolated -c "CREATE TABLE public.country(id UUID PRIMARY KEY);"
          docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d tv_guide_isolated < database/migrations/20261017_parser_write_fence.sql
      - name: Create isolated TV schema from DOCUMENTATION prototype
        run: docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d tv_guide_isolated < docs/BMAD/guide-tv-mondial-winston-schema-prototype.sql
      - name: Replay prototype to validate its schema-level idempotence
        run: docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d tv_guide_isolated < docs/BMAD/guide-tv-mondial-winston-schema-prototype.sql
      - name: Test constraints, revision immutability and stale-owner denial
        run: docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d tv_guide_isolated < docs/BMAD/guide-tv-mondial-winston-postgres-isolated-smoke.sql

      - name: Validate SCRUM-115 catalogue variants numbering and country invariants
        run: docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d tv_guide_isolated < docs/BMAD/guide-tv-mondial-scrum115-catalog-isolated-smoke.sql

      - name: Validate SCRUM-116 source rights priority and explicit channel mapping
        run: docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d tv_guide_isolated < docs/BMAD/guide-tv-mondial-scrum116-epg-sources-isolated-smoke.sql

      - name: Validate SCRUM-117 fenced TV import CAS and published grid preservation
        run: docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d tv_guide_isolated < docs/BMAD/guide-tv-mondial-scrum117-import-atomic-isolated-smoke.sql

      - name: Validate SCRUM-117 retention authorization and recent-publication denial
        run: docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d tv_guide_isolated < docs/BMAD/guide-tv-mondial-scrum117-retention-recovery-isolated-smoke.sql

      - name: Validate SCRUM-118 public TV visibility and content-level rights
        run: docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d tv_guide_isolated < docs/BMAD/guide-tv-mondial-scrum118-public-read-isolated-smoke.sql

      - name: Rehearse on LMN24 full bootstrap schema in separate throwaway database
        run: |
          docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c "CREATE DATABASE tv_guide_rehearsal;"
          docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d tv_guide_rehearsal < database/schema.sql
          docker exec ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d tv_guide_rehearsal -c "INSERT INTO country(iso_code2,iso_code3,slug) VALUES ('GB','GBR','baseline-britain'); INSERT INTO language(iso_code2) VALUES ('fr'); INSERT INTO category(slug,display_order) VALUES ('baseline',999); INSERT INTO source(name,slug,website_url,country_id) SELECT 'Baseline news','baseline-news','https://example.invalid',id FROM country WHERE iso_code2='GB';"
      - name: Save pre-migration backup
        run: |
          docker exec ${{ job.services.postgres.id }} pg_dump -U postgres -d tv_guide_rehearsal -Fc -f /tmp/tv_before.dump
          docker exec ${{ job.services.postgres.id }} pg_restore -l /tmp/tv_before.dump > /dev/null
          docker exec ${{ job.services.postgres.id }} sha256sum /tmp/tv_before.dump
      - name: Read-only PostgreSQL baseline inventory on isolated clone
        run: docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d tv_guide_rehearsal < docs/BMAD/guide-tv-mondial-winston-catalog-inventory.sql
      - name: Audit catalog and default privileges before migration
        run: docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d tv_guide_rehearsal < docs/BMAD/guide-tv-mondial-winston-audit-privileges.sql
      - name: Apply prototype against complete bootstrap and replay
        run: |
          docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d tv_guide_rehearsal < database/migrations/20261017_parser_write_fence.sql
          docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d tv_guide_rehearsal < docs/BMAD/guide-tv-mondial-winston-migration-candidate.sql
          docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d tv_guide_rehearsal < docs/BMAD/guide-tv-mondial-winston-migration-candidate.sql
          docker exec ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d tv_guide_rehearsal -Atc "SELECT CASE WHEN (SELECT COUNT(*) FROM country WHERE slug='baseline-britain')=1 AND (SELECT COUNT(*) FROM category WHERE slug='baseline')=1 AND (SELECT COUNT(*) FROM source WHERE slug='baseline-news')=1 THEN 'BASELINE_OK' ELSE 'FAIL' END;" | grep -x BASELINE_OK
      - name: Test independent concurrent PostgreSQL sessions
        env:
          TV_REHEARSAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tv_guide_rehearsal
        run: node scripts/tv-guide-concurrency-isolated.cjs
      - name: Test SQL least privilege and abrupt parser termination on disposable database
        env:
          TV_REHEARSAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tv_guide_rehearsal
        run: node scripts/tv-guide-security-isolated.cjs
      - name: Audit privileges after migration using PostgreSQL catalog
        run: docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d tv_guide_rehearsal < docs/BMAD/guide-tv-mondial-winston-audit-privileges.sql
      - name: Assert PUBLIC EXECUTE revoked from new TV trigger functions
        run: |
          docker exec ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d tv_guide_rehearsal -Atc "SELECT CASE WHEN EXISTS (SELECT 1 FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace CROSS JOIN LATERAL aclexplode(COALESCE(p.proacl,acldefault('f',p.proowner))) acl WHERE n.nspname='public' AND p.proname IN ('tv_assert_current_published','tv_assert_current_writer_lease','tv_protect_published_revision','tv_protect_published_airings') AND acl.grantee=0 AND acl.privilege_type='EXECUTE') THEN 'PRIVILEGE_FAIL' ELSE 'TV_FUNCTION_PRIVILEGE_PASS' END;" | grep -x TV_FUNCTION_PRIVILEGE_PASS
      - name: Back up modified rehearsal and restore both snapshots
        run: |
          docker exec ${{ job.services.postgres.id }} pg_dump -U postgres -d tv_guide_rehearsal -Fc -f /tmp/tv_after.dump
          docker exec ${{ job.services.postgres.id }} pg_restore -l /tmp/tv_after.dump > /dev/null
          docker exec ${{ job.services.postgres.id }} sha256sum /tmp/tv_after.dump
          docker exec ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c "CREATE DATABASE tv_guide_pre_restore;"
          docker exec ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c "CREATE DATABASE tv_guide_post_restore;"
          docker exec ${{ job.services.postgres.id }} pg_restore --exit-on-error -U postgres -d tv_guide_pre_restore /tmp/tv_before.dump
          docker exec ${{ job.services.postgres.id }} pg_restore --exit-on-error -U postgres -d tv_guide_post_restore /tmp/tv_after.dump
          docker exec ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d tv_guide_pre_restore -Atc "SELECT CASE WHEN to_regclass('public.tv_country') IS NULL AND (SELECT COUNT(*) FROM country WHERE slug='baseline-britain')=1 AND (SELECT COUNT(*) FROM source WHERE slug='baseline-news')=1 THEN 'PRE_RESTORE_OK' ELSE 'FAIL' END;" | grep -x PRE_RESTORE_OK
          docker exec ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d tv_guide_post_restore -Atc "SELECT CASE WHEN (SELECT COUNT(*) FROM pg_tables WHERE schemaname='public' AND tablename LIKE 'tv_%')=19 AND (SELECT COUNT(*) FROM country WHERE slug='baseline-britain')=1 AND (SELECT COUNT(*) FROM source WHERE slug='baseline-news')=1 AND (SELECT COUNT(*) FROM tv_schedule_current)=1 THEN 'POST_RESTORE_OK' ELSE 'FAIL' END;" | grep -x POST_RESTORE_OK
          # The concurrency scenario deliberately inserts a NEW TV test
          # country after the first backup. Compare ORIGINAL business rows,
          # not entire counts which legitimately include test fixtures.
          for table in country language category source; do
            case "$table" in
              country) filter="slug='baseline-britain'" ;;
              language) filter="iso_code2='fr'" ;;
              category) filter="slug='baseline'" ;;
              source) filter="slug='baseline-news'" ;;
            esac
            sql="SELECT md5(string_agg(row_to_json(t)::text, ',' ORDER BY row_to_json(t)::text)) FROM (SELECT * FROM $table WHERE $filter) t"
            before=$(docker exec ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d tv_guide_pre_restore -Atc "$sql")
            after=$(docker exec ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d tv_guide_post_restore -Atc "$sql")
            [ -n "$before" ] && [ "$before" = "$after" ] || { echo "BUSINESS_DATA_DIFF: $table"; exit 1; }
          done
          echo 'BACKUP_RESTORE_PASS: pre- and post-migration dumps restored.'

      - name: Refuse schema drift on disposable restored copies before replay
        run: |
          # Fresh clones of the RESTORED post-migration test database.
          # Never use remote databases or production credentials.
          docker exec ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c "CREATE DATABASE tv_guide_constraint_drift TEMPLATE tv_guide_post_restore;"
          docker exec ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c "CREATE DATABASE tv_guide_column_drift TEMPLATE tv_guide_post_restore;"
          docker exec ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d postgres -c "CREATE DATABASE tv_guide_trigger_drift TEMPLATE tv_guide_post_restore;"
          docker exec ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d tv_guide_constraint_drift -c "ALTER TABLE public.tv_airing DROP CONSTRAINT tv_airing_span;"
          docker exec ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d tv_guide_column_drift -c "ALTER TABLE public.tv_source ALTER COLUMN rights_status TYPE varchar(40);"
          docker exec ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d tv_guide_trigger_drift -c "ALTER TABLE public.tv_schedule_current DISABLE TRIGGER trg_tv_current_writer_lease;"
          for spec in 'tv_guide_constraint_drift:TV constraint drift detected' 'tv_guide_column_drift:TV column type drift detected' 'tv_guide_trigger_drift:required TV trigger missing or disabled'; do
            db="${spec%%:*}"
            expected="${spec#*:}"
            if docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d "$db" < docs/BMAD/guide-tv-mondial-winston-migration-candidate.sql > /tmp/tv-drift-result.log 2>&1; then
              echo "DRIFT_REPLAY_UNEXPECTEDLY_SUCCEEDED: $db"; exit 1
            fi
            grep -F "$expected" /tmp/tv-drift-result.log || { cat /tmp/tv-drift-result.log; exit 1; }
            echo "DRIFT_REJECTION_PASS: $db"
          done
          # Atomic preflight: no source SQL re-created the deliberately missing check.
          docker exec ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U postgres -d tv_guide_constraint_drift -Atc "SELECT count(*) FROM pg_constraint WHERE conname='tv_airing_span';" | grep -x 0
          echo 'TV_DRIFT_NEGATIVE_TESTS_PASS'
