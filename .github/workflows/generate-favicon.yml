name: Generate official LMN24 favicon
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/generate-favicon.py
      - apps/frontend/public/logo_lmn24.png
      - .github/workflows/generate-favicon.yml

permissions:
  contents: write

concurrency:
  group: official-lmn24-favicon
  cancel-in-progress: false

jobs:
  build-favicon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image library
        run: python -m pip install 'Pillow>=11,<13'
      - name: Generate and verify favicon.ico
        run: python scripts/generate-favicon.py
      - name: Publish generated favicon
        run: |
          git add apps/frontend/public/favicon.ico
          if git diff --cached --quiet; then
            echo "favicon.ico is already current."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'asset: generate official LMN24 favicon.ico from logo'
          git push origin HEAD:main
